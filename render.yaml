# Render blueprint for Lynxo Bot.
services:
  - type: web
    name: lynxo-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DISCORD_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
