# Render blueprint for the COMBINED Lynxo Bot + Murray Bot service.
# One free web service runs both bots: startCommand is `python run.py`.
# Host this on the EXISTING lynxo-bot service / Lynxo-Bot repo so the
# Discord OAuth redirect and the Lynxo dashboard API base stay valid.
# Murray dashboard moves to https://lynxo-bot.onrender.com/dashboard
services:
  - type: web
    name: lynxo-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: LYNXO_DISCORD_TOKEN
        sync: false
      - key: DISCORD_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DASHBOARD_URL
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_KEY
        sync: false
